# Développement sans Node installé : `docker compose -f compose.dev.yml up`
# puis http://localhost:5173 (HMR actif, code monté en volume).
services:
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache python3 make g++ >/dev/null && npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - '5173:5173'
    environment:
      ORIGIN: http://localhost:5173
      DATA_DIR: /app/data
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
volumes:
  dev_node_modules:
